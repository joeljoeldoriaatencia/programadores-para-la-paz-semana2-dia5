<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participa – Comunidad en Paz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section class="contenedor">
      <h1>¡Tu voz cuenta! Participa</h1>

      <p>
        Este formulario es un espacio seguro para que compartas tus ideas,
        propuestas o necesidades con tu comunidad. La información que nos entregues
        será usada únicamente con fines de participación y organización comunitaria,
        y será tratada con responsabilidad y respeto.
      </p>

      <form>
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Escribe tu nombre y apellido">
        </div>

        <div class="campo">
          <label for="barrio">Barrio o sector donde vives</label>
          <input
            type="text"
            id="barrio"
            name="barrio"
            placeholder="Ej: Centro, La Esperanza, El Bosque">
        </div>

        <div class="campo">
          <label for="propuesta">Tu propuesta o mensaje para la comunidad</label>
          <textarea
            id="propuesta"
            name="propuesta"
            placeholder="Escribe aquí tu idea, propuesta o necesidad"></textarea>
        </div>

        <div class="campo">
          <label for="contacto">Correo o teléfono de contacto (opcional)</label>
          <input
            type="text"
            id="contacto"
            name="contacto"
            placeholder="Este campo es opcional">
        </div>

        <div class="campo">
          <label>
            <input type="checkbox" name="consentimiento">
            Acepto que mi información sea usada únicamente para fines de
            participación comunitaria y que no será compartida con terceros.
          </label>
        </div>

        <button type="submit">Enviar mi participación</button>
      </form>
    </section>
  </main>

</body>
</html>
